<style>
  :root {

    --border-soft: #f3f4f6;
    --surface-hover: #f9fafb;
    --violet: #8b5cf6;
    --violet-strong: #7c3aed;
    --violet-text: #7c3aed;
    --green: #22c55e;
    --green-text: #16a34a;
    --red: #ef4444;
    --chip-bg: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #030712;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --faint: #6b7280;
      --border: #374151;
      --border-soft: rgba(31,41,55,.6);
      --surface-hover: rgba(31,41,55,.5);
      --violet-text: #a78bfa;
      --green-text: #4ade80;
      --chip-bg: #374151;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  header h1 .dot { color: var(--red); }
  header p {
    font-size: .75rem;
    color: var(--muted);
    margin: .125rem 0 0;
  }
  .header-actions { display: flex; align-items: center; gap: .5rem; }
  .confirm-wrap {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .875rem;
    color: var(--muted);
  }

  .btn {
    padding: .375rem .75rem;
    border-radius: .375rem;
    font-size: .75rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: transparent;
    color: inherit;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn-danger {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }
  .btn-danger:hover { background: #dc2626; border-color: #dc2626; }

  .progress-wrap {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .track {
    height: 6px;
    background: var(--chip-bg);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: .5rem;
  }
  .bar {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--violet);
    transition: width .3s ease, background-color .3s ease;
  }
  .bar.done { background: var(--green); }
  .progress-label { font-size: .75rem; color: var(--faint); margin: 0; }

  main { max-width: 42rem; padding: 1.5rem; }
  section { margin-bottom: 2rem; }
  section h2 {
    font-size: .6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--faint);
    margin: 0 0 .75rem;
    display: flex;
    align-items: center;
    gap: .375rem;
  }
  .cards { display: flex; flex-direction: column; gap: .5rem; }

  .card {
    border: 1px solid var(--border);
    border-radius: .5rem;
    transition: border-color .15s, background-color .15s;
  }
  .card.all-done {
    border-color: rgba(34,197,94,.3);
    background: rgba(34,197,94,.05);
  }
  .card-head {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    padding: .75rem 1rem;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: .5rem;
    color: inherit;
    transition: background-color .15s;
  }
  .card-head:hover { background: var(--surface-hover); }
  .card-name {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-weight: 500;
  }
  .check-mark { color: var(--green); font-size: .875rem; font-weight: 700; }
  .card-meta { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .chip {
    font-size: .75rem;
    font-weight: 600;
    padding: .125rem .5rem;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--muted);
  }
  .chip.done { background: rgba(34,197,94,.2); color: var(--green-text); }
  .del {
    background: none;
    border: 0;
    color: var(--faint);
    font-size: 1.125rem;
    line-height: 1;
    padding: 0 .25rem;
    transition: color .15s;
  }
  .del:hover { color: var(--red); }
  .caret { color: var(--faint); font-size: .75rem; }

  ul.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border-soft); }
  ul.tasks li {
    padding: .625rem 1rem;
    border-bottom: 1px solid var(--border-soft);
    transition: opacity .15s;
  }
  ul.tasks li:last-child { border-bottom: 0; }
  ul.tasks li.completed { opacity: .5; }
  .task-row { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
  .task-main {
    display: flex;
    align-items: flex-start;
    gap: .625rem;
    cursor: pointer;
    flex: 1;
    min-width: 0;
  }
  .task-main input[type=checkbox] {
    margin-top: .125rem;
    height: 1rem;
    width: 1rem;
    flex-shrink: 0;
    accent-color: var(--violet);
    cursor: pointer;
  }
  .task-label { font-size: .875rem; }
  a.task-label {
    color: var(--violet-text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .completed .task-label { text-decoration-line: line-through; }
  .task-desc {
    margin: .25rem 0 0 1.5rem;
    font-size: .75rem;
    color: var(--faint);
    line-height: 1.5;
  }

  .copy {
    display: flex;
    align-items: center;
    gap: .25rem;
    padding: .125rem .375rem;
    border: 0;
    border-radius: .25rem;
    background: transparent;
    font-size: .75rem;
    color: var(--faint);
    transition: color .15s, background-color .15s;
    flex-shrink: 0;
  }
  .copy:hover { color: var(--fg); background: var(--chip-bg); }
  .copy.copied { color: var(--green); }
  .copy svg { width: .75rem; height: .75rem; }

  .add-wrap { padding-bottom: 2.5rem; }
  .add-form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .add-form input[type=text] {
    flex: 1;
    min-width: 200px;
    padding: .5rem .75rem;
    font: inherit;
    font-size: .875rem;
    border: 1px solid var(--border);
    border-radius: .375rem;
    background: var(--bg);
    color: inherit;
  }
  .add-form input[type=text]:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--violet);
    border-color: transparent;
  }
  .btn-primary {
    padding: .5rem .75rem;
    font-size: .875rem;
    font-weight: 500;
    border: 0;
    border-radius: .375rem;
    background: var(--violet);
    color: #fff;
    transition: background-color .15s;
  }
  .btn-primary:hover { background: var(--violet-strong); }
  .btn-plain {
    padding: .5rem .75rem;
    font-size: .875rem;
    border: 1px solid var(--border);
    border-radius: .375rem;
    background: transparent;
    color: inherit;
  }
  .btn-plain:hover { background: var(--surface-hover); }
  .btn-add {
    padding: .5rem 1rem;
    font-size: .875rem;
    color: var(--violet-text);
    border: 1px dashed var(--violet);
    border-radius: .375rem;
    background: transparent;
    transition: background-color .15s;
  }
  .btn-add:hover { background: rgba(139,92,246,.1); }

  .note {
    max-width: 42rem;
    padding: 0 1.5rem 2rem;
    font-size: .75rem;
    color: var(--faint);
  }
</style>
</head>

let confirming = false;
let draftName = '';

function buildServices() {
  nextId = 1;
  return SEED.map((s, i) => ({
    id: nextId++,
    name: s.name,
    category: s.category,
    sort_order: i,
    is_builtin: true,
    tasks: s.tasks.map(t => ({
      id: nextId++,
      label: t.label,
      description: t.description,
      url: t.url,
      completed: false,
    })),
  }));
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    for (const k in props) {
      if (k === 'class') node.className = props[k];
      else if (k === 'text') node.textContent = props[k];
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== null && props[k] !== undefined && props[k] !== false) node.setAttribute(k, props[k]);
    }
  }
  (children || []).forEach(c => { if (c) node.appendChild(c); });
  return node;
}

function copyIcon() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('viewBox', '0 0 24 24');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  path.setAttribute('stroke-width', '2');
  path.setAttribute('d', 'M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z');
  svg.appendChild(path);
  return svg;
}

function copyButton(url) {
  const btn = el('button', { class: 'copy', title: 'Copy link', type: 'button' });
  const reset = () => {
    btn.className = 'copy';
    btn.textContent = '';
    btn.appendChild(copyIcon());
    btn.appendChild(document.createTextNode('Copy'));
  };
  reset();
  btn.addEventListener('click', async e => {
    e.preventDefault();
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(url);
    } catch (_) {
      const ta = el('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    btn.className = 'copy copied';
    btn.textContent = '✓ Copied';
    setTimeout(reset, 1500);
  });
  return btn;
}

function toggleTask(taskId) {
  for (const s of services) {
    for (const t of s.tasks) {
      if (t.id === taskId) { t.completed = !t.completed; render(); return; }
    }
  }
}

function addService(name) {
  services.push({
    id: nextId++,
    name: name,
    category: 'custom',
    sort_order: 999,
    is_builtin: false,
    tasks: CUSTOM_TASKS.map(label => ({
      id: nextId++,
      label: label,
      description: null,
      url: null,
      completed: false,
    })),
  });
}

function deleteService(id) {
  services = services.filter(s => s.id !== id);
  openIds.delete(id);
  render();
}

function resetAll() {
  services = buildServices();
  openIds = new Set();
  confirming = false;
  showAdd = false;
  draftName = '';
  render();
}

function renderServiceCard(service) {
  const done = service.tasks.filter(t => t.completed).length;
  const total = service.tasks.length;
  const allDone = total > 0 && done === total;
  const open = openIds.has(service.id);

  const card = el('div', { class: 'card' + (allDone ? ' all-done' : '') });

  const meta = el('span', { class: 'card-meta' }, [
    el('span', { class: 'chip' + (allDone ? ' done' : ''), text: done + '/' + total }),
  ]);
  if (!service.is_builtin) {
    meta.appendChild(el('button', {
      class: 'del',
      title: 'Remove',
      type: 'button',
      text: '×',
      onclick: e => { e.stopPropagation(); deleteService(service.id); },
    }));
  }
  meta.appendChild(el('span', { class: 'caret', text: open ? '▴' : '▾' }));

  const nameSpan = el('span', { class: 'card-name' });
  if (allDone) nameSpan.appendChild(el('span', { class: 'check-mark', text: '✓' }));
  nameSpan.appendChild(document.createTextNode(service.name));

  card.appendChild(el('button', {
    class: 'card-head',
    type: 'button',
    'aria-expanded': String(open),
    onclick: () => {
      if (openIds.has(service.id)) openIds.delete(service.id);
      else openIds.add(service.id);
      render();
    },
  }, [nameSpan, meta]));

  if (open) {
    const ul = el('ul', { class: 'tasks' });
    service.tasks.forEach(task => {
      const li = el('li', { class: task.completed ? 'completed' : '' });

      const box = el('input', { type: 'checkbox' });
      box.checked = task.completed;
      box.addEventListener('change', () => toggleTask(task.id));

      let labelNode;
      if (task.url) {
        labelNode = el('a', {
          class: 'task-label',
          href: task.url,
          target: '_blank',
          rel: 'noopener noreferrer',
          text: task.label,
          onclick: e => e.stopPropagation(),
        });
      } else {
        labelNode = el('span', { class: 'task-label', text: task.label });
      }

      const row = el('div', { class: 'task-row' }, [
        el('label', { class: 'task-main' }, [box, labelNode]),
        task.url ? copyButton(task.url) : null,
      ]);

      li.appendChild(row);
      if (task.description) {
        li.appendChild(el('p', { class: 'task-desc', text: task.description }));
      }
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  return card;
}

function renderHeaderActions() {
  const wrap = document.getElementById('headerActions');
  wrap.textContent = '';
  if (confirming) {
    const span = el('span', { class: 'confirm-wrap' });
    span.appendChild(document.createTextNode('Reset all progress?'));
    span.appendChild(el('button', { class: 'btn btn-danger', type: 'button', text: 'Reset', onclick: resetAll }));
    span.appendChild(el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { confirming = false; render(); } }));
    wrap.appendChild(span);
  } else {
    wrap.appendChild(el('button', {
      class: 'btn',
      type: 'button',
      text: 'New Incident',
      onclick: () => { confirming = true; render(); },
    }));
  }
}

function renderProgress() {
  const allTasks = services.flatMap(s => s.tasks);
  const doneCount = allTasks.filter(t => t.completed).length;
  const totalCount = allTasks.length;
  const pct = totalCount ? (doneCount / totalCount) * 100 : 0;
  const allClear = totalCount > 0 && doneCount === totalCount;

  const bar = document.getElementById('bar');
  bar.style.width = pct + '%';
  bar.className = 'bar' + (allClear ? ' done' : '');
  document.getElementById('progressLabel').textContent =
    allClear ? '✅ All clear' : doneCount + ' / ' + totalCount + ' tasks done';
}

function renderAddSection() {
  const wrap = el('div', { class: 'add-wrap' });
  if (showAdd) {
    const input = el('input', { type: 'text', placeholder: 'Service name (e.g. Dropbox)' });
    input.value = draftName;
    input.addEventListener('input', e => { draftName = e.target.value; });

    const form = el('form', {
      class: 'add-form',
      onsubmit: e => {
        e.preventDefault();
        const name = draftName.trim();
        if (!name) return;
        addService(name);
        draftName = '';
        showAdd = false;
        render();
      },
    }, [
      input,
      el('button', { class: 'btn-primary', type: 'submit', text: 'Add' }),
      el('button', { class: 'btn-plain', type: 'button', text: 'Cancel', onclick: () => { showAdd = false; draftName = ''; render(); } }),
    ]);
    wrap.appendChild(form);
    setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
  } else {
    wrap.appendChild(el('button', {
      class: 'btn-add',
      type: 'button',
      text: '+ Add Custom Service',
      onclick: () => { showAdd = true; render(); },
    }));
  }
  return wrap;
}

function render() {
  renderHeaderActions();
  renderProgress();

  const app = document.getElementById('app');
  app.textContent = '';

  Object.keys(CATEGORIES).forEach(catId => {
    const list = services.filter(s => s.category === catId);
    if (!list.length) return;
    const meta = CATEGORIES[catId];
    const section = el('section', null, [
      el('h2', null, [el('span', { text: meta.emoji }), document.createTextNode(meta.label)]),
    ]);
    const cards = el('div', { class: 'cards' });
    list.forEach(s => cards.appendChild(renderServiceCard(s)));
    section.appendChild(cards);
    app.appendChild(section);
  });

  app.appendChild(renderAddSection());
}

services = buildServices();
render();
</script>
</body>
</html>
